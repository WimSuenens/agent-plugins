name: Factory feedback
description: Something about the factory plugin that went wrong, felt clumsy, or is missing.
labels: ["plugin:factory"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A role agent
        - The protocol or message templates
        - /factory:run (the lead)
        - Decision cards
        - /factory:setup-factory-skill
        - The memory guard hook
        - Wayfinding hand-off
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe it in terms of the factory. Leave out your project's code, names, and data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
