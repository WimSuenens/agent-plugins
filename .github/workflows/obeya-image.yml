# Builds the Obeya app image for amd64 and arm64 and publishes it to GHCR, tagged with the app's semver (ADR 0020).
# Runs when apps/obeya changes on main, or by hand. It publishes only when the version in package.json has no tag yet,
# so an unrelated commit under apps/obeya never republishes an existing tag. No moving tag is ever pushed.
name: obeya-image

on:
  push:
    branches: [main]
    paths:
      - "apps/obeya/**"
      - ".github/workflows/obeya-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obeya-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/wimsuenens/obeya
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read the app version
        id: version
        run: |
          v=$(jq -r .version apps/obeya/package.json)
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::apps/obeya/package.json version '$v' is not a semver"; exit 1 ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip when this version is already published
        id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE:${{ steps.version.outputs.version }} already exists; bump apps/obeya/package.json to publish a new version"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.published == 'false'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - if: steps.exists.outputs.published == 'false'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - if: steps.exists.outputs.published == 'false'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: apps/obeya
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Check both architectures are under the tag
        if: steps.exists.outputs.published == 'false'
        run: |
          out=$(docker buildx imagetools inspect "$IMAGE:${{ steps.version.outputs.version }}")
          echo "$out"
          echo "$out" | grep -q 'linux/amd64' || { echo "::error::linux/amd64 missing"; exit 1; }
          echo "$out" | grep -q 'linux/arm64' || { echo "::error::linux/arm64 missing"; exit 1; }
