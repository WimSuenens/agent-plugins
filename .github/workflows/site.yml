# Builds the documentation site (apps/site), runs its unit tests and accessibility check, and publishes it to GitHub Pages.
# Pull requests build only; the deploy job runs only on main. A failed check fails the build job, so nothing deploys.
name: site

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "plugins/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "apps/site/**"
      - "plugins/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# A deploy in flight finishes; only a newer pull-request build cancels an older one.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the browser for the accessibility check
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: Build and check accessibility
        run: npm run build
        env:
          SITE_BASE: /agent-plugins

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
